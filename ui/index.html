<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Wind</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1c1b19;--mute:#6b675f;--line:#e5e2da;--accent:#2f5d50;--green:#2e7d4f;--yellow:#b7791f;--red:#b83232;--chip:#f0eee7;--me:#e4efe9}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1e1b;--ink:#eeeae0;--mute:#9a958a;--line:#33312c;--accent:#7bb8a4;--green:#5bbf85;--yellow:#e0a84a;--red:#e56b6b;--chip:#2a2824;--me:#26362f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 140px}
h1{font-size:1.5rem;margin:0}.sub{color:var(--mute);margin:2px 0 0}
.banner{margin-top:12px;padding:9px 13px;background:var(--chip);border-radius:10px;font-size:.85rem;color:var(--mute)}
nav{display:flex;gap:8px;margin:18px 0 12px}
nav button{padding:7px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.msg{margin:12px 0;display:flex}.msg.me{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}
.me .bubble{background:var(--me);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0 8px}
details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
.badge{display:inline-block;padding:3px 13px;border-radius:999px;font-weight:700;letter-spacing:.04em;color:#fff}
.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}
.mute{color:var(--mute);font-size:.88rem}
.pill{font-size:.74rem;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--mute);margin-left:6px;white-space:nowrap}
.pill.red,.pill.yellow,.pill.green{color:#fff}
.mockbar{background:var(--yellow);color:#fff;border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:10px}
.item{padding:8px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
a{color:var(--accent)}ul{margin:6px 0;padding-left:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:5px 11px;border-radius:999px;background:var(--chip);font-size:.84rem;cursor:pointer;border:0;color:var(--ink);font-family:inherit;text-align:left}
form{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding:24px 16px 16px}
.bar{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea,input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
textarea{resize:none;max-height:140px}
button.go{padding:10px 18px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button.go:disabled{opacity:.5;cursor:wait}
.score{font-size:1.4rem;font-weight:700;color:var(--accent);min-width:50px}.opp{display:flex;gap:14px}
.err{color:var(--red)}.disc{font-size:.8rem;color:var(--mute);text-align:center;margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>Second Wind</h1>
  <p class="sub">Patent triage for founders: is your idea new, and does anything still block it?</p>
  <div class="banner" id="banner">Loading…</div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="chat">Chat</button>
    <button role="tab" aria-selected="false" data-tab="scout">Browse expired patents</button>
  </nav>

  <section id="chat"><div id="log"></div></section>

  <section id="scout" hidden>
    <div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div style="flex:1;min-width:160px"><label class="mute">CPC prefix (optional)</label><input id="cpc" placeholder="e.g. A47J31"></div>
      <button class="go" id="scoutgo">Find opportunities</button></div></div>
    <div id="scoutnote" class="mute"></div><div id="opps"></div>
  </section>
</main>

<form id="form"><div class="bar">
  <textarea id="input" rows="1" placeholder="Describe your product idea, or ask a follow-up…"></textarea>
  <button class="go" id="send" type="submit">Send</button></div>
  <div class="disc">Automated research and triage, not legal advice. Consult a registered patent attorney before relying on it.</div>
</form>

<script>
const $=id=>document.getElementById(id);
function el(tag,props={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v)}
  for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){let m=r.statusText;try{const j=await r.json();m=typeof j.detail==="string"?j.detail:JSON.stringify(j.detail)}catch{}throw new Error(m)}return r.json()}
const pLink=p=>p.mock?el("span",{class:"pill",text:"mock"}):el("a",{href:p.url,target:"_blank",rel:"noopener",text:p.id});
const label=s=>s.replace("_"," ");

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("chat").hidden=b.dataset.tab!=="chat";$("scout").hidden=b.dataset.tab!=="scout";$("form").hidden=b.dataset.tab!=="chat"});

let stats=null;
Promise.all([fetch("/v1/stats").then(r=>r.json()),fetch("/health").then(r=>r.json())]).then(([s,h])=>{stats=s;const c=s.by_status;
  $("banner").textContent=`Live data: ${s.patents.toLocaleString()} real US coffee and beverage maker patents (CPC A47J31). Other industries use AI-generated mock patents for the demo. `+
    (c.lapsed===0?"No maintenance-fee data, so patents count as in force unless past 20 years. ":"")+`AI ${h.llm_enabled?"on":"off"}.`;
}).catch(()=>$("banner").textContent="Cannot reach the backend.");

const history=[];let reportId=null;
function say(role,text,extra){const b=el("div",{class:"bubble",text});const m=el("div",{class:"msg "+(role==="user"?"me":"")},b);
  $("log").append(m);if(extra)$("log").append(extra);m.scrollIntoView({block:"end"});return m}
const EXAMPLES=[["Live: cold brew coffee maker","A cold brew coffee maker where a small pump keeps cycling cold water through the coffee grounds so it brews in under two hours"],
["Live: pod barcode machine","A coffee machine that reads a barcode on the pod and adjusts water temperature and pressure automatically"],
["Mock: smart water bottle","A smart water bottle with a level sensor that tracks how much you drink and reminds you through a phone app"],
["Mock: posture strap","A wearable posture strap with an accelerometer that vibrates when you slouch"]];
const hi=el("div",{});hi.append(el("div",{class:"chips"},EXAMPLES.map(([l,t])=>el("button",{class:"chip",type:"button",title:t,text:l,onclick:()=>send(t)}))));
say("assistant","Hi! Tell me about your product idea: what it does and how it works. I'll check for prior art and patents that could block you. Try an example:",hi);

function det(title,open,...kids){const d=el("details",{},el("summary",{text:title}),...kids);if(open)d.open=true;return d}
function renderReport(r){
  const c=el("div",{class:"card"});
  if(r.data_mode==="mock"||r.data_note)c.append(el("div",{class:"mockbar",text:r.data_note}));
  c.append(el("div",{},el("span",{class:"badge "+r.triage,text:r.triage.toUpperCase()}),el("span",{class:"pill",text:"novelty: "+r.novelty_level}),el("span",{class:"pill",text:"blocking: "+r.blocking_level}),
    el("span",{class:"pill",text:(r.metrics.runtime_ms/1000).toFixed(1)+"s"})),
    el("p",{text:r.summary}));
  c.append(det("Possible blocking patents ("+r.blockers.length+")",true,
    r.blockers.length?r.blockers.map(b=>el("div",{class:"item"},pLink(b.patent)," ",b.patent.title,el("span",{class:"pill "+b.level,text:b.level}),el("span",{class:"pill",text:"overlap "+Math.round(b.claim_coverage*100)+"%"}),
      el("div",{class:"mute",text:b.why}),b.patent.fee_data||b.patent.mock?null:el("div",{class:"mute",text:"In force is assumed: no fee data loaded."}))):el("p",{class:"mute",text:"None above the threshold."})));
  const ra=r.riskiest_assumption;
  c.append(det("Riskiest assumption, as a two-week test",true,el("p",{},el("strong",{text:ra.assumption})),el("p",{text:ra.two_week_test})));
  c.append(det("Closest prior art ("+r.prior_art.length+")",false,r.prior_art.map(a=>el("div",{class:"item"},pLink(a.patent)," ",a.patent.title,
    el("span",{class:"pill",text:label(a.patent.status)}),el("span",{class:"pill",text:"overlap "+Math.round(a.claim_coverage*100)+"%"}),
    el("div",{class:"mute",text:"Shared terms: "+a.matched_terms.join(", ")})))));
  const u=r.understanding;
  if(u.source==="llm")c.append(det("How I read your idea",false,el("p",{text:u.summary}),el("ul",{},u.features.map(f=>el("li",{text:f})))));
  c.append(el("div",{class:"item"},el("strong",{text:r.attorney_handoff?"Talk to a patent attorney: ":"Attorney handoff: "}),r.attorney_handoff_reason," ",
    el("a",{href:`/v1/reports/${r.id}/packet`,download:`prior-art-${r.id}.md`,text:"Download prior-art packet"})));
  return c}

let busy=false;
async function send(text){
  text=(text||$("input").value).trim();if(!text||busy)return;
  busy=true;$("send").disabled=true;$("input").value="";
  say("user",text);history.push({role:"user",content:text});
  const wait=say("assistant","Reading your idea and searching patents…");const t0=Date.now();
  const tick=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);
    wait.firstChild.textContent=`Reading your idea and searching patents… ${s}s`+(s>15?"\n(A new industry means I am inventing mock demo patents, which can take up to a minute.)":"")},500);
  try{
    const r=await post("/v1/chat",{messages:history.slice(-12),report_id:reportId});
    clearInterval(tick);wait.remove();
    say("assistant",r.reply,r.report?renderReport(r.report):null);
    history.push({role:"assistant",content:r.reply});
    if(r.report)reportId=r.report.id;
  }catch(e){clearInterval(tick);wait.firstChild.textContent="Something went wrong: "+e.message;wait.firstChild.classList.add("err")}
  finally{busy=false;$("send").disabled=false;$("input").focus()}
}
$("form").onsubmit=e=>{e.preventDefault();send()};
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("input").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"};

$("scoutgo").onclick=async()=>{
  const cpc=$("cpc").value.trim();$("opps").replaceChildren();$("scoutnote").textContent="Searching…";
  try{
    const list=await post("/v1/scout",{statuses:["lapsed","expired"],limit:20,...(cpc?{cpc_prefixes:[cpc]}:{})});
    $("scoutnote").textContent=list.length?(stats&&stats.by_status.lapsed===0?"Real expired patents only (20-year term reached). Lapsed-fee patents need fee data, which is not loaded.":""):"No matching patents.";
    list.forEach(o=>$("opps").append(el("div",{class:"card opp"},el("div",{class:"score",text:Math.round(o.score)}),
      el("div",{},pLink(o.patent)," ",el("strong",{text:o.patent.title}),el("span",{class:"pill",text:label(o.patent.status)}),
        el("div",{class:"mute",text:o.why_lapsed}),el("ul",{},o.why_ranked.map(w=>el("li",{text:w})))))));
  }catch(e){$("scoutnote").className="err";$("scoutnote").textContent="Scout failed: "+e.message}
};
</script>
</body>
</html>
